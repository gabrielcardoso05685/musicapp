{% extends 'base.html' %}{% block content %}
<section class="login card"><div class="login-brand">♫ MusicApp</div><h1>Login</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>E-mail:<input type="email" name="email" placeholder="Digite seu e-mail" required autocomplete="username"></label><label>Senha:<input type="password" name="senha" placeholder="Digite sua senha" required autocomplete="current-password"></label><button class="red full">Entrar</button></form><a class="recover" href="{{ url_for('recover') }}">Recuperar Senha</a><a class="button blue full" href="{{ url_for('register') }}">CADASTRAR</a></section>
{% endblock %}
